[project]
name = "docflow"
version = "0.1.0"
description = "Multimodal invoice and receipt processing agent with deterministic validation and self-correction."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Afnan", email = "p229256@pwr.nu.edu.pk" }
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.3.0",
    "pypdfium2>=4.30.0",
    "opencv-python-headless>=4.9.0.80",
    "langgraph>=0.0.60",
    "streamlit>=1.35.0",
    "langfuse>=2.36.0",
    "tenacity>=8.3.0",
    "faker>=25.8.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.8",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.7",
    "pre-commit>=3.7.1",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow", "src/llmkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.py", "*.pyi"]
exclude = [
    ".venv",
    "docs",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
